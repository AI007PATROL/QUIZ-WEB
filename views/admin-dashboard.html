<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">
  <div class="card">
    <h1>🛠 Admin Dashboard</h1>
    <p class="subtitle">Live quiz control panel</p>

    <!-- QUIZ SELECT -->
    <select id="quizSelect"></select>

    <!-- ACTIONS -->
    <button class="btn" onclick="activateQuiz()">▶ Activate Quiz</button>
    <button class="btn secondary" onclick="startQuiz()">🚀 Start Quiz</button>
    <button class="btn danger" onclick="stopQuiz()">⏹ Stop / Reset</button>

    <hr>

    <button class="btn secondary"
      onclick="go('/views/admin-add-question.html')">
      ➕ Add Question
    </button>

    <button class="btn secondary"
      onclick="go('/views/admin-manage-questions.html')">
      📝 Manage Questions
    </button>

    <button class="btn secondary"
      onclick="go('/views/admin-analytics.html')">
      📊 Analytics
    </button>

    <button class="btn secondary"
      onclick="go('/views/admin-users.html')">
      👥 Manage Users
    </button>

    <button class="btn logout" onclick="logout()">🚪 Logout</button>
  </div>
</div>

<script>
let quizzes = [];
let currentQuiz = null;

/* =========================
   LOAD QUIZZES
========================= */
async function loadQuizzes() {
  const res = await fetch("/api/quizzes");
  quizzes = await res.json();

  const select = document.getElementById("quizSelect");
  select.innerHTML = "";

  quizzes.forEach(q => {
    const opt = document.createElement("option");
    opt.value = q.id;
    opt.textContent = q.title + (q.active ? " (ACTIVE)" : "");
    select.appendChild(opt);
  });

  if (quizzes.length) {
    currentQuiz = quizzes.find(q => q.active)?.id || quizzes[0].id;
    select.value = currentQuiz;
  }
}

/* =========================
   ACTIVATE QUIZ
========================= */
async function activateQuiz() {
  const quizId = quizSelect.value;

  const res = await fetch("/admin/activate-quiz", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ quizId })
  });

  const data = await res.json();
  alert(data.message);
  loadQuizzes();
}

/* =========================
   START QUIZ
========================= */
async function startQuiz() {
  const res = await fetch("/admin/start-quiz", { method: "POST" });
  const data = await res.json();
  alert(data.message);
}

/* =========================
   STOP / RESET QUIZ
========================= */
async function stopQuiz() {
  if (!confirm("Reset quiz for everyone?")) return;

  const res = await fetch("/admin/reset-quiz", { method: "POST" });
  const data = await res.json();
  alert(data.message);
}

/* =========================
   NAV
========================= */
function go(path) {
  window.location.href = path;
}

/* =========================
   LOGOUT
========================= */
function logout() {
  localStorage.clear();
  window.location.href = "/";
}

loadQuizzes();
</script>

</body>
</html>
