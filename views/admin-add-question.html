<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Question</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">
  <div class="card">
    <h1>➕ Add Question</h1>
    <p class="subtitle">Create a new quiz question</p>

    <!-- QUESTION -->
    <textarea id="question" rows="3" placeholder="Enter the question"></textarea>

    <!-- IMAGE -->
    <input type="file" id="image" accept="image/*">

    <!-- TYPE -->
    <select id="type" onchange="renderAnswers()">
      <option value="single">Single Correct</option>
      <option value="multiple">Multiple Correct</option>
    </select>

    <!-- OPTIONS -->
    <input id="opt0" placeholder="Option A">
    <input id="opt1" placeholder="Option B">
    <input id="opt2" placeholder="Option C">
    <input id="opt3" placeholder="Option D">

    <!-- CORRECT ANSWERS -->
    <div id="answers"></div>

    <button class="btn" onclick="addQuestion()">💾 Save Question</button>
    <button class="btn secondary" onclick="window.location.href='/views/admin-dashboard.html'">
      ⬅ Back
    </button>
  </div>
</div>

<script src="/js/admin-add-question.js"></script>
</body>
</html>
